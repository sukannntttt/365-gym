<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronForge — Workout Plans</title>
  <meta name="description" content="Browse personalized workout plans based on your fitness goal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">⚡</span><span class="brand-name">IronForge</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item" id="nav-dashboard"><span class="nav-icon">🏠</span><span>Dashboard</span></a>
      <a href="workout.html" class="nav-item active" id="nav-workout"><span class="nav-icon">🏋️</span><span>Workouts</span></a>
      <a href="diet.html" class="nav-item" id="nav-diet"><span class="nav-icon">🥗</span><span>Diet Plan</span></a>
      <a href="log.html" class="nav-item" id="nav-log"><span class="nav-icon">📋</span><span>Workout Log</span></a>
      <a href="progress.html" class="nav-item" id="nav-progress"><span class="nav-icon">📈</span><span>Progress</span></a>
      <a href="bmi.html" class="nav-item" id="nav-bmi"><span class="nav-icon">⚖️</span><span>BMI Calculator</span></a>
          <a href="settings.html" class="nav-item" id="nav-settings">
        <span class="nav-icon">⚙️</span><span>Settings</span>
      </a>
    </nav>
    <button class="logout-btn" onclick="logout()"><span>🚪</span> Logout</button>
  </aside>
  <header class="mobile-header">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <span class="brand-name">⚡ IronForge</span>
  </header>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>🏋️ Workout Plans</h1>
        <p class="page-sub" id="workout-subtitle">Loading your personalized plan…</p>
      </div>
      <div class="goal-filter" id="goal-filter">
        <button class="filter-btn active" onclick="filterGoal('all', this)">All</button>
        <button class="filter-btn" onclick="filterGoal('fat loss', this)">🔥 Fat Loss</button>
        <button class="filter-btn" onclick="filterGoal('muscle gain', this)">💪 Muscle Gain</button>
        <button class="filter-btn" onclick="filterGoal('weight gain', this)">⬆️ Weight Gain</button>
      </div>
    </div>

    <div id="workout-grid" class="workout-plan-grid">
      <div class="loading-full"><div class="loading-dots"><span></span><span></span><span></span></div></div>
    </div>
  </main>

  <script src="src/api.js"></script>
  <script src="src/auth.js"></script>
  <script src="js/workout.js"></script>
</body>
</html>
