<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>365 FITNESS GYM — Your Fitness Journey Starts Here</title>
  <meta name="description" content="365 FITNESS GYM App — Track workouts, diet, BMI, and your fitness progress all in one place." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-wrapper">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <h1 class="brand-name">365 FITNESS GYM</h1>
      <p class="brand-tagline">Train Smart. Live Strong.</p>
    </div>

    <!-- Tab Switcher -->
    <div class="tab-switcher">
      <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Login</button>
      <button class="tab-btn" id="tab-register" onclick="showTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <div id="login-error" class="error-msg"></div>
      <button type="submit" class="btn-primary" id="login-btn">
        <span class="btn-text">Login</span>
        <span class="btn-loader hidden">⏳</span>
      </button>

      <!-- Google Divider -->
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">or</span>
        <span class="divider-line"></span>
      </div>

      <!-- Google Sign-In Button -->
      <button type="button" class="btn-google" onclick="handleGoogleSignIn()">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div style="text-align: center; margin-top: 15px;">
        <a href="#" onclick="showTab('forgot')" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">Forgot Password?</a>
      </div>
    </form>

    <!-- Register Form -->
    <form class="auth-form hidden" id="register-form" onsubmit="handleRegister(event)">
      <div class="form-row">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Age</label>
          <input type="number" id="reg-age" placeholder="25" min="10" max="100" required />
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Height (cm)</label>
          <input type="number" id="reg-height" placeholder="175" required />
        </div>
        <div class="form-group">
          <label>Weight (kg)</label>
          <input type="number" id="reg-weight" placeholder="70" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Your Goal</label>
          <select id="reg-goal" required>
            <option value="">Select goal…</option>
            <option value="fat loss">🔥 Fat Loss</option>
            <option value="muscle gain">💪 Muscle Gain</option>
            <option value="weight gain">⬆️ Weight Gain</option>
          </select>
        </div>
        <div class="form-group">
          <label>Diet Preference</label>
          <select id="reg-diet" required>
            <option value="veg">🌿 Vegetarian</option>
            <option value="non-veg">🍗 Non-Vegetarian</option>
          </select>
        </div>
      </div>
      <div id="register-error" class="error-msg"></div>
      <button type="submit" class="btn-primary" id="register-btn">
        <span class="btn-text">Create Account</span>
        <span class="btn-loader hidden">⏳</span>
      </button>

      <!-- Google Divider -->
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">or</span>
        <span class="divider-line"></span>
      </div>

      <!-- Google Sign-Up Button -->
      <button type="button" class="btn-google" onclick="handleGoogleSignIn()">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Sign up with Google</span>
      </button>
    </form>

    <!-- Forgot Password Form -->
    <form class="auth-form hidden" id="forgot-form" onsubmit="handleForgot(event)">
      <h3 style="text-align: center; margin-bottom: 20px;">Reset Password</h3>
      <div class="form-group">
        <label>Enter your email</label>
        <input type="email" id="forgot-email" placeholder="you@example.com" required />
      </div>
      <div id="forgot-error" class="error-msg"></div>
      <button type="submit" class="btn-primary" id="forgot-btn">
        <span class="btn-text">Send Reset Link</span>
        <span class="btn-loader hidden">⏳</span>
      </button>
      <div style="text-align: center; margin-top: 15px;">
        <a href="#" onclick="showTab('login')" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">Back to Login</a>
      </div>
    </form>
  </div>

  <script src="src/api.js"></script>
  <script src="src/auth.js"></script>
  <script>
    const GOOGLE_CLIENT_ID = '268371827061-e22hs8s2hn9ausg097sf8vbg2vd2ja8a.apps.googleusercontent.com';

    // Redirect if already logged in
    if (localStorage.getItem('token')) window.location.href = 'dashboard.html';

    function showTab(tab) {
      document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
      document.getElementById('forgot-form').classList.toggle('hidden', tab !== 'forgot');
      
      const tabSwitcher = document.querySelector('.tab-switcher');
      if (tab === 'forgot') {
        tabSwitcher.style.display = 'none';
      } else {
        tabSwitcher.style.display = 'flex';
        document.getElementById('tab-login').classList.toggle('active', tab === 'login');
        document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      }
    }

    // Google Sign-In handler
    function handleGoogleSignIn() {
      if (typeof google === 'undefined' || !google.accounts) {
        const loginErr = document.getElementById('login-error');
        const regErr = document.getElementById('register-error');
        const msg = 'Google Sign-In is loading. Please try again in a moment.';
        if (loginErr) loginErr.textContent = msg;
        if (regErr) regErr.textContent = msg;
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCallback,
        auto_select: false,
        cancel_on_tap_outside: true
      });
      google.accounts.id.prompt();
    }

    async function handleGoogleCallback(response) {
      const errEl = document.getElementById('login-error');
      errEl.textContent = '';

      try {
        const data = await authFetch('/api/auth/google', {
          method: 'POST',
          body: JSON.stringify({ credential: response.credential })
        });

        if (data.token) {
          localStorage.setItem('token', data.token);
          if (data.isNewUser) {
            window.location.href = 'settings.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        } else {
          errEl.textContent = data.message || 'Google sign-in failed';
        }
      } catch (err) {
        errEl.textContent = 'Network error. Try again.';
      }
    }

    // Initialize Google on page load
    window.addEventListener('load', () => {
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCallback,
          auto_select: false
        });
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      errEl.textContent = '';
      setLoading(btn, true);
      try {
        const data = await authFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          })
        });
        if (data.token) {
          localStorage.setItem('token', data.token);
          window.location.href = 'dashboard.html';
        } else {
          errEl.textContent = data.message || 'Login failed';
        }
      } catch (err) {
        errEl.textContent = 'Network error. Try again.';
      }
      setLoading(btn, false);
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const errEl = document.getElementById('register-error');
      errEl.textContent = '';
      setLoading(btn, true);
      try {
        const data = await authFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value,
            age: parseInt(document.getElementById('reg-age').value),
            height: parseFloat(document.getElementById('reg-height').value),
            weight: parseFloat(document.getElementById('reg-weight').value),
            goal: document.getElementById('reg-goal').value,
            dietPreference: document.getElementById('reg-diet').value
          })
        });
        if (data.token) {
          localStorage.setItem('token', data.token);
          window.location.href = 'dashboard.html';
        } else {
          errEl.textContent = data.message || 'Registration failed';
        }
      } catch (err) {
        errEl.textContent = 'Network error. Try again.';
      }
      setLoading(btn, false);
    }

    async function handleForgot(e) {
      e.preventDefault();
      const btn = document.getElementById('forgot-btn');
      const errEl = document.getElementById('forgot-error');
      errEl.textContent = '';
      errEl.style.color = 'var(--text-secondary)';
      setLoading(btn, true);
      
      try {
        const data = await authFetch('/api/auth/forgotpassword', {
          method: 'POST',
          body: JSON.stringify({ email: document.getElementById('forgot-email').value })
        });
        
        errEl.textContent = data.message || 'Check your email for a reset link.';
        errEl.style.color = '#1dd1a1';
        document.getElementById('forgot-form').reset();
      } catch (err) {
        errEl.textContent = 'Network error. Try again.';
        errEl.style.color = 'var(--error)';
      }
      setLoading(btn, false);
    }

    function setLoading(btn, loading) {
      btn.querySelector('.btn-text').classList.toggle('hidden', loading);
      btn.querySelector('.btn-loader').classList.toggle('hidden', !loading);
      btn.disabled = loading;
    }
  </script>
</body>
</html>
