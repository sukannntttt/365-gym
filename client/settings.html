<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — 365 FITNESS GYM</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <style>
    .settings-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .settings-grid { grid-template-columns: 1fr; }
    }
    .settings-card { padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }
  </style>
</head>
<body>
  
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">365 FITNESS GYM</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item" id="nav-dashboard">
        <span class="nav-icon">🏠</span><span>Dashboard</span>
      </a>
      <a href="workout.html" class="nav-item" id="nav-workout">
        <span class="nav-icon">🏋️</span><span>Workouts</span>
      </a>
      <a href="athlete.html" class="nav-item" id="nav-athlete">
        <span class="nav-icon">⚡</span><span>Athlete Training</span>
      </a>
      <a href="diet.html" class="nav-item" id="nav-diet">
        <span class="nav-icon">🥗</span><span>Diet Plan</span>
      </a>
      <a href="log.html" class="nav-item" id="nav-log">
        <span class="nav-icon">📋</span><span>Workout Log</span>
      </a>
      <a href="progress.html" class="nav-item" id="nav-progress">
        <span class="nav-icon">📈</span><span>Progress</span>
      </a>
      <a href="bmi.html" class="nav-item" id="nav-bmi">
        <span class="nav-icon">⚖️</span><span>BMI Calculator</span>
      </a>
      <a href="settings.html" class="nav-item active" id="nav-settings">
        <span class="nav-icon">⚙️</span><span>Settings</span>
      </a>
    </nav>
    <button class="logout-btn" onclick="logout()">
      <span>🚪</span> Logout
    </button>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Settings</h1>
        <p class="page-sub">Update your profile parameters</p>
      </div>
    </div>

    <div class="settings-grid">
      
      <!-- Profile Form -->
      <div class="card settings-card">
        <h2 class="section-title">Physical Profile</h2>
        <form id="profile-form">
          <div class="form-row">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="set-name" required />
            </div>
            <div class="form-group">
              <label>Age</label>
              <input type="number" id="set-age" required />
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Height (cm)</label>
              <input type="number" id="set-height" required />
            </div>
            <div class="form-group">
              <label>Weight (kg)</label>
              <input type="number" id="set-weight" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Fitness Goal</label>
              <select id="set-goal" required>
                <option value="fat loss">Fat Loss</option>
                <option value="muscle gain">Muscle Gain</option>
                <option value="weight gain">Weight Gain</option>
              </select>
            </div>
            <div class="form-group">
              <label>Diet Preference</label>
              <select id="set-diet" required>
                <option value="veg">Vegetarian</option>
                <option value="non-veg">Non-Vegetarian</option>
              </select>
            </div>
          </div>

          <div id="profile-msg" style="margin-bottom: 15px; font-weight:500;"></div>
          
          <button type="submit" class="btn-primary" id="save-profile-btn">
            Save Profile
          </button>
        </form>
      </div>

      <!-- Security Settings -->
      <div class="card settings-card" style="align-self: start;">
        <h2 class="section-title">Security & Account</h2>
        <div class="form-group">
          <label>Current Email</label>
          <input type="email" id="current-email" disabled style="opacity: 0.5;" />
        </div>
        
        <form id="email-form" style="margin-top: 30px;">
          <h3 style="margin-bottom: 10px; font-size: 1.1rem;">Change Email</h3>
          <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 15px;">
            A confirmation link will be sent to your CURRENT email to authorize this change.
          </p>
          <div class="form-group">
            <label>New Email Address</label>
            <input type="email" id="new-email" placeholder="new@example.com" required />
          </div>
          <div id="email-msg" style="margin-bottom: 15px; font-size: 0.9rem; font-weight:500;"></div>
          <button type="submit" class="btn-primary" id="change-email-btn" style="background:#5e5ce6;">
            Request Change
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="src/api.js"></script>
  <script src="src/auth.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
