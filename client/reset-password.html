<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — IronForge Gym</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-wrapper">
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <h1 class="brand-name">Secure Reset</h1>
      <p class="brand-tagline">Set a new password for IronForge.</p>
    </div>

    <!-- Reset Form -->
    <form class="auth-form" id="reset-form" onsubmit="handleReset(event)">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="reset-password" placeholder="••••••••" required />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="reset-confirm" placeholder="••••••••" required />
      </div>
      <div id="reset-error" class="error-msg"></div>
      <button type="submit" class="btn-primary" id="reset-btn">
        <span class="btn-text">Reset Password</span>
        <span class="btn-loader hidden">⏳</span>
      </button>
      <div id="success-msg" style="display:none; text-align:center; color: #1dd1a1; margin-top:20px;">
        <p>Password updated successfully!</p>
        <a href="index.html" class="btn-primary" style="display:inline-block; margin-top: 15px; text-decoration:none;">Go to Login</a>
      </div>
    </form>
  </div>

  <script src="src/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // If no token in URL, show error
    if (!token) {
      document.getElementById('reset-error').textContent = 'Invalid or missing reset token.';
      document.getElementById('reset-error').style.color = '#ff6b6b';
      document.getElementById('reset-btn').disabled = true;
    }

    async function handleReset(e) {
      e.preventDefault();
      const btn = document.getElementById('reset-btn');
      const errEl = document.getElementById('reset-error');
      errEl.textContent = '';
      errEl.style.color = '#ff6b6b';

      const pwd = document.getElementById('reset-password').value;
      const confirm = document.getElementById('reset-confirm').value;

      if (pwd !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        return;
      }

      setLoading(btn, true);
      try {
        const res = await fetch(`${BASE}/api/auth/resetpassword/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          document.getElementById('reset-btn').style.display = 'none';
          document.getElementById('success-msg').style.display = 'block';
        } else {
          errEl.textContent = data.message || 'Failed to reset password.';
        }
      } catch (err) {
        errEl.textContent = 'Network error. Try again.';
      }
      setLoading(btn, false);
    }

    function setLoading(btn, loading) {
      btn.querySelector('.btn-text').classList.toggle('hidden', loading);
      btn.querySelector('.btn-loader').classList.toggle('hidden', !loading);
      btn.disabled = loading;
    }
  </script>
</body>
</html>
