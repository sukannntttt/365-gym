<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Payment — 365 FITNESS GYM</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    .amt-pill {
      display: inline-block;
      background: rgba(34, 211, 165, 0.1);
      color: var(--success);
      border: 1px solid rgba(34, 211, 165, 0.2);
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 1.4rem;
      margin: 15px 0;
      box-shadow: 0 0 20px rgba(34, 211, 165, 0.1);
    }
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }
    .tier-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      /* 3D Pushable Card */
      box-shadow: 
        inset 0 1px 1px rgba(255,255,255,0.05),
        0 6px 0 rgba(0,0,0,0.8),
        0 8px 15px rgba(0,0,0,0.4);
      transform: translateY(-4px);
    }
    .tier-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 
        inset 0 1px 1px rgba(255,255,255,0.05),
        0 8px 0 rgba(0,0,0,0.9),
        0 12px 20px rgba(0,0,0,0.5);
    }
    .tier-card.active {
      transform: translateY(2px);
      border-color: var(--accent);
      background: rgba(108, 99, 255, 0.1);
      box-shadow: 
        inset 0 1px 1px rgba(255,255,255,0.02),
        0 0 0 rgba(0,0,0,0),
        0 0 20px var(--accent-glow);
    }
    .tier-name { font-weight: 800; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 5px; }
    .tier-price { font-size: 1.2rem; font-weight: 900; color: white; }
    .tier-details { font-size: 0.7rem; color: var(--text-muted); margin-top: 10px; }
  </style>
</head>
<body>

  <div class="auth-wrapper" style="text-align: center; max-width: 500px;">
    <div class="brand" style="margin-bottom: 30px;">
      <h1 class="brand-name">Unlock Your Potential</h1>
      <p class="page-sub">Select a tier to upgrade your experience</p>
    </div>

    <!-- Tier Selection Section -->
    <div class="tier-grid">
      <div class="tier-card" onclick="selectTier('Free', 0, this)">
        <div class="tier-name">Free</div>
        <div class="tier-price">₹0</div>
        <div class="tier-details">Basic Stats</div>
      </div>
      <div class="tier-card active" onclick="selectTier('Pro', 1200, this)" id="default-tier">
        <div class="tier-name" style="color: var(--accent);">Pro</div>
        <div class="tier-price">₹1200</div>
        <div class="tier-details">Full Workouts & Analytics</div>
      </div>
      <div class="tier-card" onclick="selectTier('Elite', 2500, this)">
        <div class="tier-name" style="color: var(--accent2);">Elite</div>
        <div class="tier-price">₹2500</div>
        <div class="tier-details">Personalized Coaching</div>
      </div>
    </div>

    <div id="payment-section" style="display: none;">
      <div class="amt-pill" id="display-amt">₹1200</div>
      <p class="instruction-text">
        Scan the QR code below to subscribe to the <span id="selected-tier-name" style="color:var(--accent);font-weight:bold;">Pro</span> Tier.
      </p>

      <div class="qr-container" style="background: white; padding: 15px; border-radius: 12px; margin: 15px auto; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <img src="img/upi-qr.png" alt="UPI QR Code" style="max-width: 100%; height: auto; display: none;" id="real-qr" onerror="this.style.display='none'; document.getElementById('placeholder-qr').style.display='block';" onload="this.style.display='block'; document.getElementById('placeholder-qr').style.display='none';" />
        <div id="placeholder-qr" class="qr-placeholder" style="color: #000; text-align: center; font-weight: bold; font-size: 0.8rem;">
          [UPI QR]
        </div>
      </div>

    <form class="auth-form" id="txn-form" style="margin-top: 20px; text-align: left;">
      <div class="form-group">
        <label>Transaction ID / UTR Number</label>
        <input type="text" id="txn-id" placeholder="Enter 12-digit UPI reference number" required />
      </div>
      <div id="msg" style="margin-bottom: 10px; font-weight: bold;"></div>
      <button type="submit" class="btn-primary" id="submit-btn" style="width: 100%;">
        Submit for Verification
      </button>
      <a href="dashboard.html" style="color: var(--text-muted); text-align: center; display: block; margin-top: 15px; font-size: 0.9rem;">
        Cancel and return to dashboard
      </a>
    </form>
  </div>

  <script src="src/api.js"></script>
  <script>
    let selectedTier = 'Pro';
    let selectedAmt = 1200;

    window.selectTier = function(tier, amt, el) {
      selectedTier = tier;
      selectedAmt = amt;
      
      // Update UI
      document.querySelectorAll('.tier-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      
      const paymentSection = document.getElementById('payment-section');
      const freeMsg = document.getElementById('free-msg');
      
      if (amt === 0) {
        paymentSection.style.display = 'none';
        document.getElementById('txn-form').style.display = 'none';
        alert('Free tier is always active by default. You only need to checkout for Pro or Elite!');
      } else {
        paymentSection.style.display = 'block';
        document.getElementById('txn-form').style.display = 'block';
        document.getElementById('display-amt').textContent = `₹${amt}`;
        document.getElementById('selected-tier-name').textContent = tier;
        document.getElementById('selected-tier-name').style.color = (tier === 'Elite') ? 'var(--accent2)' : 'var(--accent)';
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('token')) {
        window.location.href = 'index.html';
      }

      // Trigger default selection
      selectTier('Pro', 1200, document.getElementById('default-tier'));

      document.getElementById('txn-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const msg = document.getElementById('msg');
        const txnId = document.getElementById('txn-id').value;

        btn.disabled = true;
        btn.textContent = 'Submitting...';

        try {
          const res = await fetch(`${BASE}/api/payment/submit-txn`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${localStorage.getItem('token')}`
            },
            body: JSON.stringify({ txnId, tier: selectedTier })
          });

          const data = await res.json();
          if (res.ok) {
            msg.style.color = '#1dd1a1';
            msg.textContent = '✅ Submitted successfully! Redirecting...';
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 2000);
          } else {
            msg.style.color = '#ff6b6b';
            msg.textContent = data.message || 'Failed to submit transaction.';
            btn.disabled = false;
            btn.textContent = 'Submit for Verification';
          }
        } catch (err) {
          msg.style.color = '#ff6b6b';
          msg.textContent = 'Network error.';
          btn.disabled = false;
          btn.textContent = 'Submit for Verification';
        }
      });
    });
  </script>
</body>
</html>
